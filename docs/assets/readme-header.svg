<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
  <title id="title">Find the failure. Keep the evidence.</title>
  <desc id="desc">Hermes Desktop Fuzzer records actions, reproduction steps, and logs for investigation and replay.</desc>
  <rect width="1040" height="320" rx="12" fill="#171c22"/>
  <path d="M0 272H1040" stroke="#353c44"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="58" fill="#aeb7c2" font-size="17">Hermes Agent Desktop Fuzzer</text>
    <text x="38" y="124" fill="#f4f2eb" font-size="48" font-weight="700">Find the failure.</text>
    <text x="38" y="182" fill="#f4f2eb" font-size="48" font-weight="700">Keep the evidence.</text>
    <text x="40" y="230" fill="#bdc5ce" font-size="19">Real UI runs. Recorded steps. Replay at the same commit.</text>
    <text x="40" y="303" fill="#e9b777" font-size="16">Explore Desktop</text>
    <path d="M193 297H237m-6-5 6 5-6 5" fill="none" stroke="#6e7b89" stroke-width="1.5"/>
    <text x="260" y="303" fill="#e9b777" font-size="16">Capture a finding</text>
    <path d="M414 297H458m-6-5 6 5-6 5" fill="none" stroke="#6e7b89" stroke-width="1.5"/>
    <text x="481" y="303" fill="#e9b777" font-size="16">Replay and reduce</text>
  </g>
  <rect x="664" y="36" width="336" height="208" rx="6" fill="#20272f" stroke="#424b56"/>
  <path d="M664 81H1000" stroke="#424b56"/>
  <g font-family="Consolas, Courier New, monospace" font-size="18">
    <text x="684" y="65" fill="#e9b777">finding/</text>
    <g fill="#d7dee6">
      <text x="709" y="116">actions.json</text>
      <text x="709" y="152">repro.md</text>
      <text x="709" y="188">manifest.json</text>
      <text x="709" y="224">desktop.log</text>
    </g>
  </g>
  <path d="M689 99V219m0-109h9m-9 36h9m-9 36h9m-9 37h9" fill="none" stroke="#637181" stroke-width="1.5"/>
</svg>
